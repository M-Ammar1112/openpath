# OpenPath — Python project configuration (backend + tooling)
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openpath"
version = "0.1.0"
description = "OpenPath — Scholarships, Universities & Career Opportunity Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "httpx>=0.28",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "feedparser>=6.0",
  "apscheduler>=3.11",
  "PyYAML>=6.0.1",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-PyYAML>=6.0",
  "types-python-dateutil>=2.9",
]
postgres = [
  "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
app = ["taxonomy/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "feedparser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:apscheduler.*",
]